[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-fortigate"
version = "1.0.0"
description = "MCP server to inspect and manage FortiOS firewalls over the REST API (FastMCP, streamable HTTP)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ratno" }]
keywords = ["mcp", "model-context-protocol", "fortigate", "fortios", "fastmcp", "firewall"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastmcp>=4.0",
    "httpx>=0.27",
    "jsonschema>=4.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
mcp-fortigate = "mcp_fortigate.server:run"

[project.urls]
Homepage = "https://github.com/ratno/mcp-fortigate"
Issues = "https://github.com/ratno/mcp-fortigate/issues"

[tool.setuptools.packages.find]
include = ["mcp_fortigate*"]